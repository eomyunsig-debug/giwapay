name: giwapay-demo

x-api-environment: &api-environment
  NODE_ENV: development
  HOST: 0.0.0.0
  PORT: 3001
  LOG_LEVEL: ${LOG_LEVEL:-info}
  EXPOSE_API_DOCS: 'true'
  DATABASE_URL: ${DATABASE_URL}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:3000}
  TRUSTED_PROXY_CIDRS: ''
  WEB_BASE_URL: ${WEB_BASE_URL:-http://127.0.0.1:3000}
  PUBLIC_API_URL: ${PUBLIC_API_URL:-http://127.0.0.1:3001}
  SESSION_SECRET: ${SESSION_SECRET}
  API_KEY_PEPPER: ${API_KEY_PEPPER}
  WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY}
  GIWA_CHAIN_ID: '91342'
  GIWA_RPC_URL: http://anvil:8545
  GIWA_RPC_FALLBACK_URLS: ''
  CHAIN_EXPLORER_URL: ''
  RPC_TIMEOUT_MS: '10000'
  RPC_RETRY_COUNT: '3'
  CHAIN_READ_CACHE_TTL_MS: '2000'
  ROUTER_CONFIGURATION_CACHE_TTL_MS: '300000'
  QUOTE_RATE_LIMIT_MAX: '30'
  PREPARE_RATE_LIMIT_MAX: '20'
  CHAIN_CONFIRMATIONS: '3'
  CHAIN_START_BLOCK: '0'
  INDEXER_BATCH_SIZE: '250'
  INDEXER_POLL_INTERVAL_MS: '1000'
  REORG_LOOKBACK_BLOCKS: '1000'
  PAYMENT_ROUTER_ADDRESS: ${PAYMENT_ROUTER_ADDRESS}
  MERCHANT_REGISTRY_ADDRESS: ${MERCHANT_REGISTRY_ADDRESS}
  ADAPTER_REGISTRY_ADDRESS: ${ADAPTER_REGISTRY_ADDRESS}
  PLATFORM_FEE_BPS: ${PLATFORM_FEE_BPS:-50}
  ALLOW_TEST_CONTRACTS: 'true'
  SUPPORTED_PAYMENT_TOKENS_JSON: ${SUPPORTED_PAYMENT_TOKENS_JSON}
  WEBHOOK_MAX_ATTEMPTS: '8'
  WEBHOOK_TIMEOUT_MS: '10000'
  WEBHOOK_POLL_INTERVAL_MS: '1000'
  API_KEY_LAST_USED_WRITE_INTERVAL_MS: '300000'
  RETENTION_POLL_INTERVAL_MS: '3600000'
  AUTH_RETENTION_DAYS: '7'
  WEBHOOK_RETENTION_DAYS: '90'
  RETENTION_BATCH_SIZE: '1000'

services:
  postgres:
    image: postgres:18.4-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-giwapay}
      POSTGRES_USER: ${POSTGRES_USER:-giwapay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-giwapay} -d ${POSTGRES_DB:-giwapay}']
      interval: 3s
      timeout: 3s
      retries: 20

  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.7.1
    restart: unless-stopped
    entrypoint: ['anvil']
    command: ['--host', '0.0.0.0', '--chain-id', '91342', '--block-time', '1', '--silent']
    ports:
      - '127.0.0.1:8545:8545'
    healthcheck:
      test: ['CMD', 'cast', 'rpc', '--rpc-url', 'http://127.0.0.1:8545', 'eth_chainId']
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: *api-environment
    command: ['node', 'node_modules/@giwapay/db/dist/migrate.js']
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      <<: *api-environment
      PAYMENT_INTENT_SIGNER_PRIVATE_KEY: ${PAYMENT_INTENT_SIGNER_PRIVATE_KEY}
    command: ['node', 'dist/server.js']
    ports:
      - '127.0.0.1:3001:3001'
    depends_on:
      migrate:
        condition: service_completed_successfully
      anvil:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  indexer:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment: *api-environment
    command: ['node', 'dist/indexer.js']
    depends_on:
      migrate:
        condition: service_completed_successfully
      anvil:
        condition: service_healthy

  webhooks:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment: *api-environment
    command: ['node', 'dist/webhook-worker.js']
    depends_on:
      migrate:
        condition: service_completed_successfully

  retention:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment: *api-environment
    command: ['node', 'dist/retention-worker.js']
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://127.0.0.1:3000}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:3001}
        NEXT_PUBLIC_GIWA_RPC_URL: ${NEXT_PUBLIC_GIWA_RPC_URL:-http://127.0.0.1:8545}
        NEXT_PUBLIC_GIWA_RPC_FALLBACK_URLS: ''
        NEXT_PUBLIC_GIWA_EXPLORER_URL: ''
        NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ''
        NEXT_PUBLIC_ALLOW_TEST_CONTRACTS: 'true'
        NEXT_PUBLIC_PAYMENT_ROUTER_ADDRESS: ${PAYMENT_ROUTER_ADDRESS}
        NEXT_PUBLIC_MERCHANT_REGISTRY_ADDRESS: ${MERCHANT_REGISTRY_ADDRESS}
        NEXT_PUBLIC_MOCK_KRW_ADDRESS: ${MOCK_KRW_ADDRESS}
        NEXT_PUBLIC_MOCK_USDC_ADDRESS: ${MOCK_USDC_ADDRESS}
        NEXT_PUBLIC_MOCK_ALT_ADDRESS: ${MOCK_ALT_ADDRESS}
        NEXT_PUBLIC_MOCK_TOKEN_FAUCET_ADDRESS: ${MOCK_TOKEN_FAUCET_ADDRESS}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://127.0.0.1:3000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:3001}
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
