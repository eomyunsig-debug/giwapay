[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 20_000
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [{ access = "read", path = "./" }]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/"
]

[profile.default.fuzz]
runs = 512
max_test_rejects = 65_536

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = false

[profile.ci]
fuzz = { runs = 2_000 }
invariant = { runs = 256, depth = 96, fail_on_revert = false }
