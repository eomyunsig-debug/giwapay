name: giwapay

x-api-environment: &api-environment
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: 3001
  LOG_LEVEL: ${LOG_LEVEL:-info}
  EXPOSE_API_DOCS: ${EXPOSE_API_DOCS:-false}
  DATABASE_URL: ${DATABASE_URL}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
  TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
  WEB_BASE_URL: ${WEB_BASE_URL}
  PUBLIC_API_URL: ${PUBLIC_API_URL}
  SESSION_SECRET: ${SESSION_SECRET}
  SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN}
  API_KEY_PEPPER: ${API_KEY_PEPPER}
  WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY}
  GIWA_CHAIN_ID: '91342'
  GIWA_RPC_URL: ${GIWA_RPC_URL}
  GIWA_RPC_FALLBACK_URLS: ${GIWA_RPC_FALLBACK_URLS:-}
  CHAIN_EXPLORER_URL: ${CHAIN_EXPLORER_URL:-https://sepolia-explorer.giwa.io}
  RPC_TIMEOUT_MS: ${RPC_TIMEOUT_MS:-10000}
  RPC_RETRY_COUNT: ${RPC_RETRY_COUNT:-3}
  CHAIN_READ_CACHE_TTL_MS: ${CHAIN_READ_CACHE_TTL_MS:-2000}
  ROUTER_CONFIGURATION_CACHE_TTL_MS: ${ROUTER_CONFIGURATION_CACHE_TTL_MS:-300000}
  QUOTE_RATE_LIMIT_MAX: ${QUOTE_RATE_LIMIT_MAX:-30}
  PREPARE_RATE_LIMIT_MAX: ${PREPARE_RATE_LIMIT_MAX:-20}
  CHAIN_CONFIRMATIONS: ${CHAIN_CONFIRMATIONS:-12}
  CHAIN_START_BLOCK: ${CHAIN_START_BLOCK}
  INDEXER_BATCH_SIZE: ${INDEXER_BATCH_SIZE:-250}
  INDEXER_POLL_INTERVAL_MS: ${INDEXER_POLL_INTERVAL_MS:-2000}
  REORG_LOOKBACK_BLOCKS: ${REORG_LOOKBACK_BLOCKS:-1000}
  PAYMENT_ROUTER_ADDRESS: ${PAYMENT_ROUTER_ADDRESS}
  MERCHANT_REGISTRY_ADDRESS: ${MERCHANT_REGISTRY_ADDRESS}
  ADAPTER_REGISTRY_ADDRESS: ${ADAPTER_REGISTRY_ADDRESS}
  PAYMENT_INTENT_SIGNER_SOURCE: ${PAYMENT_INTENT_SIGNER_SOURCE:-database}
  PAYMENT_INTENT_SIGNER_CACHE_TTL_MS: ${PAYMENT_INTENT_SIGNER_CACHE_TTL_MS:-5000}
  AWS_REGION: ${AWS_REGION}
  AWS_KMS_ENDPOINT: ${AWS_KMS_ENDPOINT:-}
  AWS_KMS_READINESS_KEY_ID: ${AWS_KMS_READINESS_KEY_ID}
  AWS_KMS_TIMEOUT_MS: ${AWS_KMS_TIMEOUT_MS:-3000}
  PAYMENT_INTENT_SIGNER_KEYS_JSON: ${PAYMENT_INTENT_SIGNER_KEYS_JSON:-}
  PLATFORM_FEE_BPS: ${PLATFORM_FEE_BPS}
  ALLOW_TEST_CONTRACTS: 'false'
  SUPPORTED_PAYMENT_TOKENS_JSON: ${SUPPORTED_PAYMENT_TOKENS_JSON}
  WEBHOOK_MAX_ATTEMPTS: ${WEBHOOK_MAX_ATTEMPTS:-8}
  WEBHOOK_TIMEOUT_MS: ${WEBHOOK_TIMEOUT_MS:-10000}
  WEBHOOK_POLL_INTERVAL_MS: ${WEBHOOK_POLL_INTERVAL_MS:-1000}
  API_KEY_LAST_USED_WRITE_INTERVAL_MS: ${API_KEY_LAST_USED_WRITE_INTERVAL_MS:-300000}
  RETENTION_POLL_INTERVAL_MS: ${RETENTION_POLL_INTERVAL_MS:-3600000}
  AUTH_RETENTION_DAYS: ${AUTH_RETENTION_DAYS:-7}
  WEBHOOK_RETENTION_DAYS: ${WEBHOOK_RETENTION_DAYS:-90}
  RETENTION_BATCH_SIZE: ${RETENTION_BATCH_SIZE:-1000}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}

services:
  migrate:
    image: ${GIWAPAY_API_IMAGE}
    environment: *api-environment
    command: ['node', 'node_modules/@giwapay/db/dist/migrate.js']
    restart: 'no'

  api:
    image: ${GIWAPAY_API_IMAGE}
    restart: unless-stopped
    environment:
      <<: *api-environment
    command: ['node', 'dist/server.js']
    ports:
      - '127.0.0.1:${GIWAPAY_API_PORT:-3001}:3001'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  indexer:
    image: ${GIWAPAY_API_IMAGE}
    restart: unless-stopped
    environment: *api-environment
    command: ['node', 'dist/indexer.js']
    depends_on:
      migrate:
        condition: service_completed_successfully

  webhooks:
    image: ${GIWAPAY_API_IMAGE}
    restart: unless-stopped
    environment: *api-environment
    command: ['node', 'dist/webhook-worker.js']
    depends_on:
      migrate:
        condition: service_completed_successfully

  retention:
    image: ${GIWAPAY_API_IMAGE}
    restart: unless-stopped
    environment: *api-environment
    command: ['node', 'dist/retention-worker.js']
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: ${GIWAPAY_WEB_IMAGE}
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - '127.0.0.1:${GIWAPAY_WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
